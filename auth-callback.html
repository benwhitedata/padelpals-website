<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Pals</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="Icon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config-loader.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --dark-blue: #1a2238;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            margin: 0;
            overflow: hidden;
        }
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loader {
            border: 6px solid rgba(26, 34, 56, 0.1);
            border-radius: 50%;
            border-top: 6px solid var(--dark-blue);
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        .logo {
            width: 100px;
            margin-bottom: 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <img src="images/Icon.png" alt="Padel Pals" class="logo">
        <div class="loader"></div>
    </div>

    <script>
        document.addEventListener('configLoaded', () => {
            processAuthentication();
        });

        async function processAuthentication() {
            let supabase;
            try {
                console.log('🔐 Starting authentication process...');
                
                // Use shared Supabase client instance (created by config-loader.js)
                supabase = window.getOrCreateSupabaseClient ? window.getOrCreateSupabaseClient() : window.supabase.createClient(
                    window.config.supabaseUrl, 
                    window.config.supabaseKey
                );
                
                console.log('✓ Supabase client ready');
                
                // Get the hash fragment from the URL
                const hashFragment = window.location.hash.substring(1);
                const queryParams = new URLSearchParams(window.location.search);
                console.log('URL hash present:', !!hashFragment);
                console.log('URL query present:', !!window.location.search);
                
                // Store callback data for diagnostic tool
                try {
                    localStorage.setItem('oauth_last_callback', JSON.stringify({
                        timestamp: Date.now(),
                        url: window.location.href,
                        hash: window.location.hash,
                        query: window.location.search,
                        hasHash: !!hashFragment
                    }));
                } catch (e) {
                    console.warn("Could not store callback info:", e);
                }

                const hashParams = new URLSearchParams(hashFragment);
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');
                const authCode = queryParams.get('code');
                const errorParam = hashParams.get('error') || queryParams.get('error');
                const errorDescription = hashParams.get('error_description') || queryParams.get('error_description');
                
                // Store parsed params for diagnostic
                try {
                    localStorage.setItem('oauth_callback_params', JSON.stringify({
                        timestamp: Date.now(),
                        hasAccessToken: !!accessToken,
                        hasRefreshToken: !!refreshToken,
                        hasAuthCode: !!authCode,
                        error: errorParam,
                        errorDescription: errorDescription,
                        allParams: Object.fromEntries([...hashParams.entries(), ...queryParams.entries()])
                    }));
                } catch (e) {
                    console.warn("Could not store callback params:", e);
                }
                
                // Check for OAuth errors first
                if (errorParam) {
                    console.error('❌ OAuth error from provider:', errorParam);
                    console.error('Description:', errorDescription);
                    const normalisedDescription = (errorDescription || '').toLowerCase();
                    // Map common provider-side misconfiguration to a clear user-facing message.
                    if (
                        errorParam === 'server_error' &&
                        normalisedDescription.includes('unable to exchange external code')
                    ) {
                        throw new Error('Apple sign-in is temporarily unavailable due to provider configuration. Please use Google sign-in while we resolve this.');
                    }
                    throw new Error(`OAuth error: ${errorParam} - ${errorDescription || 'No description'}`);
                }
                
                console.log('Access token present:', !!accessToken);
                console.log('Refresh token present:', !!refreshToken);
                console.log('Auth code present:', !!authCode);

                if (accessToken) {
                    // Implicit / hash-token path used by Apple and Google
                    console.log('📝 Setting session in Supabase...');
                    const { error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    
                    if (error) {
                        console.error('❌ setSession error:', error);
                        throw new Error(`Failed to set session: ${error.message}`);
                    }
                    
                    console.log('✓ Session set successfully');
                } else {
                    // detectSessionInUrl may already have consumed a PKCE code or magic-link tokens
                    console.log('🔍 Checking for an existing session...');
                    let { data: existing } = await supabase.auth.getSession();

                    if (!existing.session && authCode) {
                        console.log('📝 Exchanging auth code for session...');
                        const { error } = await supabase.auth.exchangeCodeForSession(authCode);
                        if (error) {
                            console.error('❌ exchangeCodeForSession error:', error);
                            throw new Error(`Failed to complete sign-in: ${error.message}`);
                        }
                    } else if (!existing.session) {
                        console.error('❌ No hash fragment, auth code, or existing session');
                        throw new Error("No authentication data in URL. The OAuth redirect may have failed.");
                    }
                }
                
                // Get the current session to confirm it worked
                console.log('🔍 Verifying session...');
                const { data } = await supabase.auth.getSession();
                
                if (!data.session) {
                    console.error('❌ Session verification failed - no session data returned');
                    throw new Error("Session was set but verification failed. Token may be invalid.");
                }
                
                console.log('✓ Session verified! User ID:', data.session.user.id);
                var next = '/dashboard.html';
                try {
                    var stored = sessionStorage.getItem('pp_after_auth') || '';
                    sessionStorage.removeItem('pp_after_auth');
                    if (stored === 'courts.html' || stored === '/courts.html') next = '/courts.html';
                } catch (e) {}
                console.log('➡️ Redirecting to', next);
                window.location.href = next;
                
            } catch (error) {
                console.error("❌ Authentication error:", error);
                console.error("Error details:", {
                    message: error.message,
                    name: error.name,
                    stack: error.stack
                });
                
                // Store detailed error information for diagnostic tool
                const errorInfo = {
                    timestamp: Date.now(),
                    message: error.message,
                    name: error.name,
                    url: window.location.href,
                    hash: window.location.hash,
                    query: window.location.search,
                    userAgent: navigator.userAgent,
                    errorType: 'callback_exchange'
                };
                
                try {
                    // Store in localStorage for diagnostic tool to find
                    const existingErrors = JSON.parse(localStorage.getItem('oauth_diagnostic_errors') || '[]');
                    existingErrors.push(errorInfo);
                    // Keep only last 5 errors
                    if (existingErrors.length > 5) {
                        existingErrors.shift();
                    }
                    localStorage.setItem('oauth_diagnostic_errors', JSON.stringify(existingErrors));
                    localStorage.setItem('oauth_last_error', JSON.stringify(errorInfo));
                } catch (e) {
                    console.error("Could not store error info:", e);
                }
                
                // Clear any partial session data using the same client instance
                try {
                    if (supabase && supabase.auth) {
                        console.log('🧹 Cleaning up failed session...');
                        await supabase.auth.signOut();
                    }
                } catch (signOutError) {
                    console.error("Error signing out:", signOutError);
                }
                
                // Clear redirect time to prevent loops
                localStorage.removeItem('authRedirectTime');
                
                // Redirect back to auth page on error with error message
                const encodedError = encodeURIComponent(error.message || 'Authentication failed');
                console.log('➡️ Redirecting to auth.html with error');
                window.location.href = `/auth.html?error=${encodedError}`;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
