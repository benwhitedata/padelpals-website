  <style>

    .lsn-wrap{max-width:900px;margin:0 auto;padding:36px 20px 80px}

    }
    .lsn-run-item header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:6px}
    .lsn-run-item strong{color:#1a2238}
    .lsn-run-item .lsn-run-when{font-weight:700;color:#2A3990}
    .lsn-run-item p{margin:0 0 6px;color:#333}
    .lsn-run-private{color:#555;font-size:var(--pp-t-meta)}
    .lsn-run-actions{display:flex;gap:8px;margin-top:8px}
    @media (max-width:720px){.lsn-log-row{grid-template-columns:1fr}}
  </style>

<body class="mkt-page" data-page="coach-planner-game.html">
  <div id="lsnLoading" class="lsn-state">
    <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
    <p>Loading game…</p>
  </div>

  <div id="lsnUnavailable" class="lsn-state" hidden>
    <i class="fas fa-lock" aria-hidden="true"></i>
    <h2>This game isn't available to you right now</h2>
    <p>That's either because it doesn't exist, or because you are not signed in.</p>
    <a class="mkt-btn mkt-btn-light" href="auth.html">Sign in</a>
    <br>
    <a class="mkt-btn mkt-btn-light" style="margin-top:10px" href="coach-planner.html">About Coach Planner</a>
  </div>

  <article id="lsnContent" hidden>
    <section class="mkt-hero lsn-hero">
      <div class="mkt-hero-inner">
        <p class="mkt-eyebrow" id="lsnKind">Game</p>
        <h1 id="lsnTitle"></h1>
        <p class="lsn-hero-meta" id="lsnHeroMeta"></p>
        <p class="lsn-hero-meta" id="gmSummary" hidden></p>
        <button type="button" class="lsn-log-btn" id="gmLog" hidden>Log this game</button>
        <p class="lsn-kids-pill" id="lsnKids" hidden></p>
      </div>
    </section>

    <div class="lsn-wrap">
      <div class="lsn-section" id="lsnKidsWrap" hidden>
        <h2>With kids</h2>
        <div class="lsn-body" id="lsnKidsNote"></div>
      </div>

      <div class="lsn-section" id="lsnWhenWrap" hidden>
        <h2>When to pick it</h2>
        <div class="lsn-body" id="lsnWhen"></div>
      </div>

      <div class="lsn-section">
        <h2>How to run it</h2>
        <div class="lsn-body" id="lsnSetup"></div>
      </div>

      <div class="lsn-section" id="lsnClipWrap" hidden>
        <h2>Clip</h2>
        <p class="lsn-clip" id="lsnClip"></p>
      </div>

      <div class="lsn-section" id="gmLogSection" hidden>
        <h2>Coach feedback</h2>
        <form id="gmForm" class="lsn-log" hidden>
          <div class="lsn-log-row">
            <label>Date
              <input type="date" id="gmDate" required>
            </label>
            <label>Group
              <select id="gmGroup"></select>
            </label>
          </div>
          <fieldset class="lsn-log-stars">
            <legend>How did it land?</legend>
            <div id="gmStars" role="group" aria-label="Score from 1 to 5"></div>
          </fieldset>
          <label>Comment for other coaches
            <textarea id="gmComment" maxlength="1000" rows="3" placeholder="What worked, and what you would change"></textarea>
          </label>
          <label>Private note
            <textarea id="gmNote" maxlength="1000" rows="2" placeholder="Only you can see this"></textarea>
          </label>
          <p class="lsn-log-error" id="gmError" hidden></p>
          <div class="lsn-log-actions">
            <button type="submit" class="mkt-btn" id="gmSave">Save</button>
            <button type="button" class="lsn-chip" id="gmCancel">Cancel</button>
          </div>
        </form>
        <div id="gmList"></div>
      </div>

      <div class="lsn-section lsn-library">
        <a class="mkt-btn mkt-btn-light" href="coach-planner-library.html?view=games">Back to games</a>
        <a class="mkt-btn mkt-btn-light" href="coach-planner-library.html">Back to the library</a>
      </div>
    </div>
  </article>

  <script>
    function esc(s) {
      var d = document.createElement('div');
      d.textContent = (s === null || s === undefined) ? '' : String(s);
      return d.innerHTML;
    }

    function kindLabel(kind) {
      if (kind === 'warmup') return 'Warm-up';
      if (kind === 'overhead') return 'Overhead';
      return 'Conditioned game';
    }

    function kidsLabel(bands) {
      var list = bands || [];
      var young = list.indexOf('8-11') !== -1;
      var older = list.indexOf('11-14') !== -1;
      if (young && older) return 'Kids 8–14';
      if (older) return 'Kids 11–14';
      if (young) return 'Kids 8–11';
      return '';
    }

    function showState(id) {
      ['lsnLoading', 'lsnUnavailable', 'lsnContent'].forEach(function (x) {
        document.getElementById(x).hidden = (x !== id);
      });
    }

    function paint(game) {
      document.title = (game.title || 'Game') + ' | Coach Planner | Padel Pals';
      document.getElementById('lsnKind').textContent = kindLabel(game.kind);
      document.getElementById('lsnTitle').textContent = game.title || '';
      document.getElementById('lsnHeroMeta').textContent = game.blurb || '';
      document.getElementById('lsnHeroMeta').hidden = !game.blurb;

      var kids = kidsLabel(game.junior_bands);
      var kidsEl = document.getElementById('lsnKids');
      kidsEl.textContent = kids;
      kidsEl.hidden = !kids;

      var note = (game.junior_note || '').trim();
      document.getElementById('lsnKidsWrap').hidden = !note;
      document.getElementById('lsnKidsNote').textContent = note;

      var when = (game.when_to_pick || '').trim();
      document.getElementById('lsnWhenWrap').hidden = !when;
      document.getElementById('lsnWhen').textContent = when;

      var setup = (game.setup || game.blurb || '').trim();
      document.getElementById('lsnSetup').textContent = setup || 'No setup written yet.';

      var clipWrap = document.getElementById('lsnClipWrap');
      if (game.video_url) {
        clipWrap.hidden = false;
        document.getElementById('lsnClip').innerHTML =
          '<a href="' + esc(game.video_url) + '" target="_blank" rel="noopener noreferrer">Watch ' +
          esc(game.title) + '</a>';
      } else {
        clipWrap.hidden = true;
      }
      showState('lsnContent');
    }

    var currentGame = null;
    var iAmCoach = false;
    var myUserId = null;
    var gameRuns = [];
    var runNotes = {};
    var coachNames = {};
    var editingId = null;
    var draftRating = null;
    var RUN_GROUPS = ['Intro to Padel', 'Beginner / Improver', 'Improver / Intermediate', 'Advanced'];
    var RUN_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function plannerClient() {
      return window.getOrCreateSupabaseClient && window.getOrCreateSupabaseClient();
    }

    function isoToday() {
      var d = new Date();
      var m = d.getMonth() + 1;
      var day = d.getDate();
      return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    function shortRunDate(iso) {
      if (!iso) return '';
      var parts = String(iso).split('-');
      if (parts.length < 3) return iso;
      return Number(parts[2]) + ' ' + (RUN_MONTHS[Number(parts[1]) - 1] || '');
    }

    function coachLabel(id) {
      if (id === myUserId) return 'You';
      return coachNames[id] || 'Coach';
    }

    function setGameError(message) {
      var el = document.getElementById('gmError');
      el.textContent = message || '';
      el.hidden = !message;
    }

    function paintStars() {
      var html = '';
      var n;
      for (n = 1; n <= 5; n++) {
        html += '<button type="button" class="lsn-star" data-star="' + n + '" aria-pressed="' +
          (draftRating === n ? 'true' : 'false') + '" aria-label="' + n + ' out of 5">' +
          (draftRating !== null && n <= draftRating ? '★' : '☆') + '</button>';
      }
      document.getElementById('gmStars').innerHTML = html;
    }

    function fillGroups(selected) {
      document.getElementById('gmGroup').innerHTML = '<option value="">Not set</option>' +
        RUN_GROUPS.map(function (g) {
          return '<option value="' + esc(g) + '"' + (g === selected ? ' selected' : '') + '>' + esc(g) + '</option>';
        }).join('');
    }

    function openGameForm(run) {
      editingId = run ? run.id : null;
      draftRating = run && run.rating != null ? run.rating : null;
      document.getElementById('gmDate').value = run ? run.run_on : isoToday();
      fillGroups(run ? (run.group_label || '') : '');
      document.getElementById('gmComment').value = run && run.comment ? run.comment : '';
      document.getElementById('gmNote').value = run && runNotes[run.id] ? runNotes[run.id] : '';
      document.getElementById('gmSave').textContent = run ? 'Update' : 'Save';
      setGameError('');
      paintStars();
      document.getElementById('gmForm').hidden = false;
      document.getElementById('gmDate').focus();
    }

    function closeGameForm() {
      editingId = null;
      draftRating = null;
      document.getElementById('gmForm').hidden = true;
      setGameError('');
    }

    function renderGameSummary() {
      var el = document.getElementById('gmSummary');
      if (!iAmCoach || !gameRuns.length) {
        el.hidden = true;
        el.textContent = '';
        return;
      }
      var mine = gameRuns.filter(function (row) { return row.coach_id === myUserId; });
      var rated = gameRuns.filter(function (row) { return row.rating != null; });
      var parts = [];
      if (mine.length) parts.push('You last ran this ' + shortRunDate(mine[0].run_on));
      parts.push(gameRuns.length + ' run' + (gameRuns.length === 1 ? '' : 's'));
      if (rated.length) {
        var sum = 0;
        rated.forEach(function (row) { sum += row.rating; });
        parts.push((sum / rated.length).toFixed(1) + ' from ' + rated.length + ' rating' + (rated.length === 1 ? '' : 's'));
      }
      el.textContent = parts.join(' · ');
      el.hidden = false;
    }

    function renderGameList() {
      var list = document.getElementById('gmList');
      if (!gameRuns.length) {
        list.innerHTML = '<p class="lsn-run-empty">No sessions logged yet.</p>';
        return;
      }
      list.innerHTML = gameRuns.map(function (run) {
        var bits = [coachLabel(run.coach_id)];
        if (run.group_label) bits.push(run.group_label);
        var stars = run.rating != null ? ('★'.repeat(run.rating) + '☆'.repeat(5 - run.rating)) : '';
        var note = run.coach_id === myUserId ? runNotes[run.id] : '';
        var actions = run.coach_id === myUserId
          ? '<div class="lsn-run-actions"><button type="button" class="lsn-chip" data-edit="' + esc(run.id) + '">Edit</button>' +
            '<button type="button" class="lsn-chip" data-delete="' + esc(run.id) + '">Delete</button></div>'
          : '';
        return '<article class="lsn-run-item"><header><span class="lsn-run-when">' + esc(shortRunDate(run.run_on)) +
          '</span><strong>' + esc(bits.join(' · ')) + '</strong>' +
          (stars ? '<span aria-label="' + run.rating + ' out of 5">' + stars + '</span>' : '') +
          '</header>' +
          (run.comment ? '<p>' + esc(run.comment) + '</p>' : '') +
          (note ? '<p class="lsn-run-private">Only you: ' + esc(note) + '</p>' : '') +
          actions + '</article>';
      }).join('');
    }

    function loadNames(client) {
      var ids = [];
      gameRuns.forEach(function (row) {
        if (row.coach_id && row.coach_id !== myUserId && !coachNames[row.coach_id] && ids.indexOf(row.coach_id) === -1) {
          ids.push(row.coach_id);
        }
      });
      if (!ids.length) return Promise.resolve();
      return client.from('user_profiles').select('id, display_name, short_name').in('id', ids).then(function (result) {
        ((result && result.data) || []).forEach(function (row) {
          coachNames[row.id] = row.short_name || row.display_name || 'Coach';
        });
      });
    }

    function loadGameRuns() {
      var client = plannerClient();
      if (!client || !currentGame) return;
      client.schema('coaching').from('game_runs')
        .select('id, game_id, coach_id, run_on, group_label, rating, comment')
        .eq('game_id', currentGame.id)
        .order('run_on', { ascending: false })
        .order('created_at', { ascending: false })
        .then(function (result) {
          gameRuns = (result && result.data && !result.error) ? result.data : [];
          var ids = gameRuns.map(function (row) { return row.id; });
          var notesReq = ids.length
            ? client.schema('coaching').from('game_run_notes').select('run_id, note').in('run_id', ids)
            : Promise.resolve({ data: [] });
          return Promise.all([notesReq, loadNames(client)]).then(function (parts) {
            runNotes = {};
            ((parts[0] && parts[0].data) || []).forEach(function (row) { runNotes[row.run_id] = row.note; });
            renderGameSummary();
            renderGameList();
          });
        });
    }

    function savePrivateNote(client, runId, note) {
      var trimmed = (note || '').trim();
      if (!trimmed) {
        if (!runNotes[runId]) return Promise.resolve();
        return client.schema('coaching').from('game_run_notes').delete().eq('run_id', runId);
      }
      return client.schema('coaching').from('game_run_notes').upsert({
        run_id: runId,
        coach_id: myUserId,
        note: trimmed
      }, { onConflict: 'run_id' });
    }

    function saveGameRun(event) {
      event.preventDefault();
      var client = plannerClient();
      if (!client || !currentGame || !iAmCoach) return;
      var comment = document.getElementById('gmComment').value.trim();
      var payload = {
        run_on: document.getElementById('gmDate').value,
        group_label: document.getElementById('gmGroup').value || null,
        rating: draftRating,
        comment: comment || null
      };
      if (!payload.run_on) {
        setGameError('Choose the date you ran it.');
        return;
      }
      var saveBtn = document.getElementById('gmSave');
      saveBtn.disabled = true;
      setGameError('');
      var write;
      if (editingId) {
        write = client.schema('coaching').from('game_runs').update(payload).eq('id', editingId).select('id').single();
      } else {
        payload.game_id = currentGame.id;
        payload.coach_id = myUserId;
        write = client.schema('coaching').from('game_runs').insert(payload).select('id').single();
      }
      write.then(function (result) {
        if (result.error || !result.data) {
          saveBtn.disabled = false;
          setGameError(result.error && result.error.code === '23505'
            ? 'You already logged this game for that group on that date. Edit that entry instead.'
            : 'Could not save this session. Try again.');
          return;
        }
        savePrivateNote(client, result.data.id, document.getElementById('gmNote').value).then(function (noteResult) {
          saveBtn.disabled = false;
          if (noteResult && noteResult.error) {
            setGameError('The session was saved, but the private note was not.');
            loadGameRuns();
            return;
          }
          closeGameForm();
          loadGameRuns();
        });
      }).catch(function () {
        saveBtn.disabled = false;
        setGameError('Could not save this session. Try again.');
      });
    }

    document.getElementById('gmLog').addEventListener('click', function () {
      if (document.getElementById('gmForm').hidden || editingId) openGameForm(null);
      else closeGameForm();
    });
    document.getElementById('gmCancel').addEventListener('click', closeGameForm);
    document.getElementById('gmForm').addEventListener('submit', saveGameRun);
    document.getElementById('gmStars').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-star]');
      if (!btn) return;
      var n = Number(btn.getAttribute('data-star'));
      draftRating = draftRating === n ? null : n;
      paintStars();
    });
    document.getElementById('gmList').addEventListener('click', function (e) {
      var edit = e.target.closest('[data-edit]');
      var del = e.target.closest('[data-delete]');
      if (edit) {
        var run = gameRuns.filter(function (row) { return row.id === edit.getAttribute('data-edit'); })[0];
        if (run) openGameForm(run);
      } else if (del && window.confirm('Delete this session log?')) {
        var client = plannerClient();
        if (!client) return;
        client.schema('coaching').from('game_runs').delete().eq('id', del.getAttribute('data-delete')).then(function (result) {
          if (result.error) return;
          if (editingId === del.getAttribute('data-delete')) closeGameForm();
          loadGameRuns();
        });
      }
    });

    var booted = false;
    var tries = 0;
    function boot() {
      if (booted) return;
      var client = window.getOrCreateSupabaseClient && window.getOrCreateSupabaseClient();
      if (!client) {
        if (tries++ > 50) {
          showState('lsnUnavailable');
          return;
        }
        setTimeout(boot, 80);
        return;
      }
      booted = true;

      var slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) {
        showState('lsnUnavailable');
        return;
      }

      client.auth.getSession().then(function (result) {
        if (!(result.data && result.data.session)) {
          try {
            sessionStorage.setItem('pp_after_auth', 'coach-planner-game.html' + window.location.search);
          } catch (e) {}
          showState('lsnUnavailable');
          return;
        }
        var userId = result.data.session.user.id;
        return Promise.all([
          client.schema('coaching').from('games').select('*').eq('slug', slug).maybeSingle(),
          client.from('user_profiles').select('is_coach').eq('id', userId).maybeSingle()
        ]).then(function (parts) {
          return { game: parts[0], profile: parts[1], userId: userId };
        });
      }).then(function (res) {
        if (!res || !res.game || res.game.error || !res.game.data) {
          showState('lsnUnavailable');
          return;
        }
        currentGame = res.game.data;
        myUserId = res.userId;
        iAmCoach = !!(res.profile && res.profile.data && res.profile.data.is_coach && !res.profile.error);
        var canLog = iAmCoach && (currentGame.kind === 'warmup' || currentGame.kind === 'mini');
        document.getElementById('gmLog').hidden = !canLog;
        document.getElementById('gmLogSection').hidden = !canLog;
        paint(currentGame);
        if (canLog) loadGameRuns();
      }).catch(function () {
        showState('lsnUnavailable');
      });
    }

    document.addEventListener('configLoaded', boot);
    if (window.config && window.config.supabaseKey) boot();
  </script>
</body>
</html>
